model:
  base_model_name: "sentence-transformers/paraphrase-multilingual-MiniLM-L12-v2"
  fine_tuned_model_path: "models/ecommerce-semantic-model"
  embedding_dimension: 384
  normalize_embeddings: true
  device: "auto"

tokenizer:
  show_tokens: true
  show_token_ids: true
  show_attention_mask: true
  max_length: 128
  truncation: true
  padding: "max_length"

training:
  full_dataset_path: "data/training_pairs.jsonl"
  train_dataset_path: "data/train_pairs.jsonl"
  validation_dataset_path: "data/val_pairs.jsonl"
  test_dataset_path: "data/test_pairs.jsonl"
  output_dir: "models/ecommerce-semantic-model"
  epochs: 1
  batch_size: 16
  learning_rate: 0.00002
  warmup_ratio: 0.1
  evaluation_steps: 100
  save_steps: 100
  random_seed: 42

dataset_split:
  train_ratio: 0.8
  validation_ratio: 0.1
  test_ratio: 0.1
  group_by:
    - source_table
    - source_id
  shuffle: true
  output_dir: "data"

evaluation:
  split_retrieval:
    default_limit: 5
    default_query_types:
      - specific
      - navigational
    default_evaluation_mode: exact_id
    default_source_tables:
      - urun_varyantlari
      - siparisler
      - kargolar
      - iadeler
      - kuponlar
      - musteriler
    random_sample: false
    seed: 42
    max_failures: 20
    save_results: true
    output_dir: "reports/evaluation"

loss:
  name: "MultipleNegativesRankingLoss"
